query FetchStyleContent($id: String!) {
  product(id: $id) {
    id
    masterData {
      staged {
        name(locale: "en-US")
        masterVariant {
          attributesRaw(includeNames: ["style-content"]) {
            name
            referencedResource {
              ... on CustomObject {
                id
                version
                container
                key
                value
              }
            }
          }
        }
      }
    }
  }
}
